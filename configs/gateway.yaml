server:
  port: 8080
  read_timeout: 30s
  write_timeout: 120s

providers:
  openai:
    base_url: "https://api.openai.com/v1"
    timeout: 30s
    max_retries: 2
    retry_backoff: 1s
    models:
      - gpt-4o
      - gpt-4o-mini
      - gpt-3.5-turbo
  anthropic:
    base_url: "https://api.anthropic.com"
    timeout: 30s
    max_retries: 2
    retry_backoff: 1s
    models:
      - claude-sonnet-4-20250514
      - claude-haiku-35-20241022
  google:
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    timeout: 30s
    max_retries: 2
    retry_backoff: 1s
    models:
      - gemini-2.0-flash
      - gemini-2.0-pro

health:
  failure_threshold: 5
  cooldown_period: 30s

model_aliases:
  "gpt4": "gpt-4o"
  "claude": "claude-sonnet-4-20250514"
  "gemini": "gemini-2.0-flash"

log:
  level: info
  format: json
  debug_bodies: false

database:
  postgres:
    dsn: ""               # GATEWAY_DATABASE__POSTGRES__DSN (env-only)
    auto_migrate: false   # GATEWAY_DATABASE__POSTGRES__AUTO_MIGRATE
    max_connections: 20
  redis:
    dsn: ""               # GATEWAY_DATABASE__REDIS__DSN (env-only)

auth:
  enabled: true
  admin_token: ""         # GATEWAY_AUTH__ADMIN_TOKEN (env-only)
  cache_ttl: 5m
  cache_size: 10000

rate_limit:
  enabled: true
  default_rpm: 60
  default_tpm: 100000

metrics:
  enabled: true
  port: 9090

routing:
  # default_strategy is consulted whenever a group does not pin its own.
  # Valid values: cost_optimized | latency_optimized | round_robin | weighted | priority
  default_strategy: priority
  # max_attempts caps the number of distinct provider attempts per request.
  # Read but not exercised until M4.2 (fallback loop).
  max_attempts: 3
  # model_groups expands an incoming "group name" model field into a list
  # of candidate (provider, model) pairs that the strategy ranks. Leave
  # empty to disable groups; concrete model names and aliases keep
  # working via the registry.
  # Example:
  #   model_groups:
  #     fast:
  #       strategy: cost_optimized   # optional per-group override
  #       candidates:
  #         - { provider: openai, model: gpt-4o-mini,      cost_per_1k_input: 0.00015, cost_per_1k_output: 0.0006, priority: 0, weight: 1 }
  #         - { provider: google, model: gemini-2.0-flash, cost_per_1k_input: 0.0001,  cost_per_1k_output: 0.0004, priority: 1, weight: 1 }
  model_groups: {}
  # pricing supplies cost-per-1k figures for concrete-model and alias
  # requests so cost_optimized has data to rank. Empty = treated as
  # "no cost data" (cost_optimized falls back to round-robin).
  # Example:
  #   pricing:
  #     gpt-4o: { cost_per_1k_input: 0.0025, cost_per_1k_output: 0.01 }
  pricing: {}
